<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA — Check-in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f9ff;color:#07111f}.top{padding:22px 6vw;background:#fff;border-bottom:1px solid #dbe5f2;display:flex;justify-content:space-between;align-items:center}.top b{letter-spacing:.15em}.top a,.top button{color:#0756d6;text-decoration:none;background:none;border:0;cursor:pointer;font-weight:700}.wrap{max-width:1100px;margin:45px auto;padding:0 20px}.login{max-width:430px;margin:90px auto;background:#fff;border:1px solid #dbe5f2;border-radius:24px;padding:30px;box-shadow:0 20px 60px rgba(20,70,130,.08)}.login h1{margin-top:0}.field{display:flex;flex-direction:column;gap:7px;margin:15px 0}.field input{padding:14px;border:1px solid #cbd9ea;border-radius:12px;font:inherit}.btn{border:0;background:#0756d6;color:#fff;padding:13px 18px;border-radius:999px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}.msg{margin-top:12px;padding:12px;border-radius:12px;display:none}.bad{background:#fff0f0;color:#a22a2a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat,.panel{background:#fff;border:1px solid #dbe5f2;border-radius:20px;padding:22px;box-shadow:0 15px 45px rgba(20,70,130,.07)}.stat small{color:#667085}.stat strong{display:block;font-size:38px;margin-top:8px}.panel{margin-top:18px}.scan{display:grid;grid-template-columns:1fr 1fr;gap:20px}.scanbox{min-height:320px}.input{display:flex;gap:10px}.input input{flex:1;padding:14px;border:1px solid #cbd9ea;border-radius:12px}.result{margin-top:16px;padding:15px;border-radius:14px;display:none}.ok{background:#eaf7ef;color:#17663a}.result.bad{background:#fff0f0;color:#a22a2a}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8eef7;font-size:14px}@media(max-width:800px){.stats,.scan{grid-template-columns:1fr}.input{flex-direction:column}}
</style></head>
<body><div class="top"><b>NEXORA · CHECK-IN</b><div><a href="index.html">Public RSVP</a> <button onclick="logout()">LOG OUT</button></div></div>
<div id="loginView" class="login"><h1>Admin login</h1><p>Sign in to manage NEXORA event check-in.</p><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" onclick="login()">SIGN IN</button><div id="loginMsg" class="msg bad"></div></div>
<div id="appView" class="wrap" style="display:none"><h1>Event check-in</h1><p>Scan a ticket QR or enter the ticket code manually.</p>
<div class="stats"><div class="stat"><small>TOTAL RSVPs</small><strong id="total">0</strong></div><div class="stat"><small>CHECKED IN</small><strong id="in">0</strong></div><div class="stat"><small>NOT CHECKED IN</small><strong id="out">0</strong></div></div>
<div class="panel scan"><div><h3>Scan QR</h3><div id="reader" class="scanbox"></div></div><div><h3>Manual ticket code</h3><div class="input"><input id="code" placeholder="NXR-XXXXXX"><button class="btn" onclick="checkCode()">CHECK</button></div><div id="result" class="result"></div><h3 style="margin-top:35px">Recent registrations</h3><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Type</th><th>Ticket</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div>
<script>
const {createClient}=supabase; const sb=createClient(NEXORA_SUPABASE.url,NEXORA_SUPABASE.publishableKey); let scanner=null;
async function login(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;const m=document.getElementById('loginMsg');m.style.display='none';const {error}=await sb.auth.signInWithPassword({email,password});if(error){m.textContent=error.message;m.style.display='block';return;}showApp();}
async function logout(){await sb.auth.signOut();location.reload()}
async function showApp(){document.getElementById('loginView').style.display='none';document.getElementById('appView').style.display='block';await render();if(!scanner){scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:230,height:230}},false);scanner.render(decoded=>checkCode(decoded),()=>{});}}
async function render(){const {data,error}=await sb.from('registration').select('id,full_name,business_type,ticket_code,checked_in,checked_in_at,created_at').order('created_at',{ascending:false}).limit(100);if(error){console.error(error);return;}const c=data.filter(x=>x.checked_in).length;document.getElementById('total').textContent=data.length;document.getElementById('in').textContent=c;document.getElementById('out').textContent=data.length-c;document.getElementById('rows').innerHTML=data.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.business_type)}</td><td>${esc(x.ticket_code)}</td><td>${x.checked_in?'✓ Checked in':'Not checked in'}</td></tr>`).join('');}
async function checkCode(code=document.getElementById('code').value.trim()){code=(code||'').trim();if(!code)return;const r=document.getElementById('result');r.style.display='block';r.className='result';r.textContent='Checking…';const {data,error}=await sb.rpc('checkin_ticket',{p_ticket_code:code});if(error){r.className='result bad';r.textContent='✕ '+error.message;return;}const x=data&&data[0]?data[0]:data;if(!x||!x.status){r.className='result bad';r.textContent='✕ Ticket not found.';return;}if(x.status==='already_checked_in'){r.className='result bad';r.textContent=`⚠ Already checked in — ${x.full_name} at ${new Date(x.checked_in_at).toLocaleString()}`;return;}r.className='result ok';r.textContent=`✓ Check-in successful — ${x.full_name} · ${x.ticket_code}`;document.getElementById('code').value='';await render();}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
sb.auth.getSession().then(({data})=>{if(data.session)showApp();});
</script></body></html>
